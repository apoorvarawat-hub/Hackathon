<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | myKaarma Discovery Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      background: #F5F7FA;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border: 1px solid #E9EAEB;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(10,13,18,0.08);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-mark {
      width: 40px;
      height: 40px;
      background: #ED6D22;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.5px;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 700;
      color: #1A1A2E;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: #E9EAEB;
    }

    .heading {
      text-align: center;
    }
    .heading h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1A1A2E;
      margin-bottom: 6px;
    }
    .heading p {
      font-size: 13px;
      color: #535862;
      line-height: 1.5;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px 20px;
      background: #fff;
      border: 1.5px solid #DADCE0;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #3C4043;
      text-decoration: none;
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .google-btn:hover {
      border-color: #0377B3;
      box-shadow: 0 2px 8px rgba(3,119,179,0.12);
    }
    .google-btn svg {
      flex-shrink: 0;
    }

    .error-box {
      width: 100%;
      background: #FFF1F0;
      border: 1px solid #B42318;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 13px;
      color: #B42318;
      display: none;
    }
    .error-box.visible { display: block; }

    .footer-note {
      font-size: 11px;
      color: #B8B8B8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <div class="logo-mark">mk</div>
      <span class="brand-name">myKaarma</span>
    </div>

    <div class="divider"></div>

    <div class="heading">
      <h1>Contact Discovery Agent</h1>
      <p>Sign in with your myKaarma Google account<br>to access the discovery workflow.</p>
    </div>

    <div class="error-box" id="errorBox"></div>

    <a href="/auth/google" class="google-btn">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Sign in with Google
    </a>

    <p class="footer-note">Access is restricted to authorized myKaarma accounts.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const err = params.get('error');
    if (err) {
      const box = document.getElementById('errorBox');
      box.textContent = decodeURIComponent(err);
      box.classList.add('visible');
    }
  </script>
</body>
</html>
